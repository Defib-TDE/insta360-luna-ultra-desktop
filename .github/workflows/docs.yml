name: Docs

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "nuxt.config.ts"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Allow one concurrent deployment, and let a newer push cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Install ffmpeg
        # docs:generate's fixture step (scripts/make-fixtures.mjs) shells out
        # to ffmpeg to synthesize the demo's sample photos, clips and the
        # live-view Annex-B stream, and the generated fixtures are gitignored
        # (no committed fallback), so the build hard-depends on ffmpeg being
        # on PATH. Ubuntu's apt package is built with libfreetype, which the
        # live-view fixture's `drawtext` filter (the "SIMULATED PREVIEW"
        # caption) needs — verified below rather than assumed, since a
        # freetype-less ffmpeg build fails that filter at run time, not at
        # install time.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -filters | grep -q drawtext || {
            echo "::error::installed ffmpeg has no drawtext filter (needs libfreetype)"
            exit 1
          }
      - run: bun install --frozen-lockfile
      - name: Build the docs site
        run: bun --cwd=docs/site run generate
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/site/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
