[package]
name = "luna-ultra-webcam-dev"
version = "0.3.2-1"
description = "Development build of the Luna Ultra desktop companion with a webcam bridge"
authors = ["Defib-TDE", "Ripwords contributors"]
repository = "https://github.com/Defib-TDE/insta360-luna-ultra-desktop"
publish = false
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Dev runs the bare binary, and macOS shows its filename in the Dock;
# cargo forbids spaces in target names, so this is as close as dev can get
[[bin]]
name = "LunaUltraWebcamDev"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2.9.0"
tauri-plugin-fs = "2.6.0"
tauri-plugin-http = "2.8.0"
tokio = { version = "1", features = ["net", "time", "sync", "io-util", "macros", "rt", "process"] }
